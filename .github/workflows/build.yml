name: Build

on:
  push:
    branches: [main]

# A newer push supersedes an older run, so an older run can never finish last and
# publish an older dev build.
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Check already lints githubDebug; this covers the variants that ship.
      - name: Lint the release variants
        run: ./gradlew lintGithubRelease lintPlayRelease

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Robolectric fetches its android-all jar at test runtime with its own resolver,
      # into ~/.m2 — outside the Gradle cache setup-gradle restores. Without this the
      # ~100 MB jar is re-downloaded on every run.
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history: the versionCode is the commit count, shared with release.yml.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed GitHub release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ./gradlew assembleGithubRelease -PrequireSigning \
            -PappVersionName="dev-${SHORT_SHA}" \
            -PappVersionCode="$(git rev-list --count HEAD)"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/github/release/app-github-release.apk

  dev-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: app-release

      # Updated in place: the tag moves to this commit and the new APK replaces the old
      # one, so the download page exists throughout.
      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="motoLauncher-dev-${GITHUB_SHA::7}.apk"
          mv app-github-release.apk "$apk"
          notes="Automated development build from commit $GITHUB_SHA on $GITHUB_REF_NAME. This is a pre-release snapshot, not intended for production use."
          git tag -f dev "$GITHUB_SHA"
          git push -f origin refs/tags/dev
          if gh release view dev > /dev/null 2>&1; then
            gh release upload dev "$apk" --clobber
            gh release edit dev --title "Development Build" --notes "$notes" --prerelease --latest=false
            gh release view dev --json assets --jq '.assets[].name' \
              | { grep -vxF "$apk" || true; } \
              | while read -r old; do gh release delete-asset dev "$old" --yes; done
          else
            gh release create dev "$apk" --title "Development Build" --notes "$notes" --prerelease --latest=false
          fi

  dist:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: app-release

      # The token selects the dist repository; the version equals the build's versionName.
      - name: Push the dev APK to the dist store
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          version="dev-${GITHUB_SHA::7}"
          curl -fsS -H "Authorization: Bearer $DIST_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -T app-github-release.apk \
            "https://codevoid.de/dist/motoLauncher-$version.apk?version=$version"
