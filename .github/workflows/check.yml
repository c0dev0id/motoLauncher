name: Check

# Pre-merge gate: lint, unit tests and the debug builds on every branch push.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads its android-all jar into ~/.m2, outside the Gradle cache.
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-

      - name: Test the release scripts
        run: python3 -m unittest discover -s .github/scripts

      - name: Lint, test and build debug
        run: >-
          ./gradlew --continue
          lintGithubDebug testGithubDebugUnitTest
          assembleGithubDebug assemblePlayDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
