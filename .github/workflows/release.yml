name: Release

# Cuts the next 1.0.x from main: moves the [Unreleased] changelog entries under the new
# version, tags it, publishes the github APK as a GitHub release and uploads the play
# bundle to Google Play.
on:
  workflow_dispatch:
    inputs:
      play_track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_status:
        description: Google Play release status (draft while the app has never been published)
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Choose the version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            version=1.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$version" >> "$GITHUB_ENV"

      - name: Commit the changelog for the version
        run: |
          python3 .github/scripts/changelog.py release "$VERSION" "$(date -u +%F)" > "$RUNNER_TEMP/notes.md"
          git config user.name c0dev0id
          git config user.email sh+git@codevoid.de
          git commit -qam "Release $VERSION"
          git tag "v$VERSION"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build the GitHub APK and the Play bundle
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleGithubRelease bundlePlayRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$VERSION_CODE"
          mv app/build/outputs/apk/github/release/app-github-release.apk "motoLauncher-$VERSION.apk"

      # Nothing is pushed until both builds exist, and the push fails as a whole if main
      # moved meanwhile.
      - name: Push the release commit and tag
        run: git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: false
          make_latest: true
          files: motoLauncher-${{ env.VERSION }}.apk

      - name: Upload the Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ env.VERSION }}
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            app/build/outputs/mapping/playRelease/mapping.txt
          if-no-files-found: error

      - name: Write the Play release notes
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          python3 .github/scripts/changelog.py play-notes "$RELEASE_URL" \
            < "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"

      - name: Upload to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.codevoid.motolauncher
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          releaseName: ${{ env.VERSION }}
          tracks: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          mappingFile: app/build/outputs/mapping/playRelease/mapping.txt
