name: Release

# Cuts the next patch version from main: moves the [Unreleased] changelog entries under
# the new version, tags it, publishes the github APK as a GitHub release and uploads the
# play bundle to Google Play. The build job holds the signing secrets and read access;
# the publish job holds write access and the Play secret, and runs no Gradle.
on:
  workflow_dispatch:
    inputs:
      play_track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_status:
        description: Google Play release status (draft while the app has never been published)
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: release

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Choose the version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            version=1.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The release commit and tag travel to the publish job as a git bundle.
      - name: Write the release notes and commit the changelog
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/whatsnew"
          python3 .github/scripts/changelog.py release "$VERSION" "$(date -u +%F)" > "$out/notes.md"
          python3 .github/scripts/changelog.py play-notes \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION" \
            < "$out/notes.md" > "$out/whatsnew/whatsnew-en-US"
          git config user.name c0dev0id
          git config user.email sh+git@codevoid.de
          git commit -qam "Release $VERSION"
          git tag "v$VERSION"
          git bundle create "$out/release.bundle" "refs/tags/v$VERSION" "^$GITHUB_SHA"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build the GitHub APK and the Play bundle
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleGithubRelease bundlePlayRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$(git rev-list --count HEAD)"
          out="$RUNNER_TEMP/release"
          cp app/build/outputs/apk/github/release/app-github-release.apk "$out/motoLauncher-$VERSION.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "$out/"
          mkdir "$out/mapping"
          cp app/build/outputs/mapping/githubRelease/mapping.txt "$out/mapping/github.txt"
          cp app/build/outputs/mapping/playRelease/mapping.txt "$out/mapping/play.txt"

      # Kept before anything is pushed, so a failed publish loses nothing.
      - name: Keep the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the release files
        uses: actions/download-artifact@v4.1.3
        with:
          name: release-${{ env.VERSION }}
          path: ${{ runner.temp }}/release

      # One atomic push, which fails as a whole if main moved since the build. A re-run of
      # this job finds the tag already pushed and goes on.
      - name: Push the release commit and tag
        run: |
          git fetch -q "$RUNNER_TEMP/release/release.bundle" "refs/tags/v$VERSION:refs/tags/v$VERSION"
          commit=$(git rev-parse "v$VERSION^{commit}")
          if [ "$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)" = "$commit" ]; then
            echo "v$VERSION is already pushed"
          else
            git push --atomic origin "$commit:refs/heads/main" "refs/tags/v$VERSION"
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The v$VERSION release exists"
          else
            gh release create "v$VERSION" "$RUNNER_TEMP/release/motoLauncher-$VERSION.apk" \
              --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/release/notes.md"
          fi

      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.codevoid.motolauncher
          releaseFiles: ${{ runner.temp }}/release/app-play-release.aab
          releaseName: ${{ env.VERSION }}
          tracks: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          whatsNewDirectory: ${{ runner.temp }}/release/whatsnew
          mappingFile: ${{ runner.temp }}/release/mapping/play.txt
